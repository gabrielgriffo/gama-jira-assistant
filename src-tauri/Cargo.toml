[package]
name = "gama"
version = "0.1.0"
description = "A desktop workspace for your Jira projects"
authors = ["Gabriel Griffo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-prevent-default = "6"
keyring = "4"
zeroize = { version = "1", features = ["serde"] }
log = "0.4"
# tauri-plugin-mcp-bridge = "0.13.0"
tauri-plugin-log = "2"
reqwest = { version = "0.13", features = ["json", "query"] }
url = "2"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
wiremock = "0.6"

