<div class="app">
  <aside class="side" aria-label="Navegação">
    <nav class="nav">
      <div class="nav-label">Trabalho</div>
      <button
        routerLink="/tasks"
        routerLinkActive="active"
        [attr.aria-current]="currentRoute === '/tasks' ? 'page' : null"
      >
        <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2.75 4h.5M6 4h7.25M2.75 8h.5M6 8h7.25M2.75 12h.5M6 12h7.25" />
        </svg>
        <span>Tarefas</span>
      </button>
      <button
        routerLink="/worklog"
        routerLinkActive="active"
        [attr.aria-current]="currentRoute === '/worklog' ? 'page' : null"
      >
        <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="5.75" />
          <path d="M8 5v3.25l2.25 1.5" />
        </svg>
        <span>Gerar worklogs</span>
      </button>
      <button
        routerLink="/worklog-history"
        routerLinkActive="active"
        [attr.aria-current]="currentRoute === '/worklog-history' ? 'page' : null"
      >
        <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="2.25" y="3.25" width="11.5" height="10.5" rx="2" />
          <path d="M2.25 6.75h11.5M5.5 1.75v3M10.5 1.75v3" />
        </svg>
        <span>Histórico de worklogs</span>
      </button>
      <div class="nav-label">Sistema</div>
      <button
        routerLink="/settings"
        routerLinkActive="active"
        [attr.aria-current]="currentRoute === '/settings' ? 'page' : null"
      >
        <svg class="ic" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7" />
          <circle cx="10.5" cy="4.5" r="1.5" />
          <circle cx="5.5" cy="11.5" r="1.5" />
        </svg>
        <span>Configurações</span>
      </button>
    </nav>
    <div class="side-foot">
      <div class="who">
        <b [title]="userName()">{{ userName() }}</b>
        <span [title]="jiraInstance()">{{ jiraInstance() }}</span>
      </div>
    </div>
  </aside>
  <main id="main">
    <div class="main-inner">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
